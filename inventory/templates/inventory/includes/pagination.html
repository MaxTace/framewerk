{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Страницы">
  {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Назад</a>{% else %}<span class="disabled">← Назад</span>{% endif %}
  <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее →</a>{% else %}<span class="disabled">Далее →</span>{% endif %}
</nav>
{% endif %}
